name: build-check

# 2026-11-11 から、GitHub のリリース(配布物)には上げない。
#   配信は Mac の tools/publish-release.sh が Cloudflare の duo-releases(R2)へ出す。
#   車の更新アプリも GitHub を見に行かない(GitHub への定期的なアクセスでアカウントが止められたため)。
# ここに残すのは「手で動かしたときに、作れるかだけを確かめる」ビルドだけ。
#   push・PR では動かさない。リリース・Issue への書き込み・車への合図もしない。
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BT_READ: '37.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Java:17 / 25 も入れておく(本体 apps/duo の toolchain 用)。最後に書いた 21 が既定
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - name: Gradle に Java の場所を教える(toolchain 用)
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "platforms;android-37.0" \
            "build-tools;$BT_READ" \
            "ndk;27.0.12077973" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: 版番号と、本体があるか
        run: |
          echo "VC=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -f apps/duo/settings.gradle ] || [ -f apps/duo/settings.gradle.kts ]; then
            echo "HAS_DUO=1" >> "$GITHUB_ENV"
          else
            echo "HAS_DUO=0" >> "$GITHUB_ENV"
            echo "apps/duo がないので、本体は作りません"
          fi

      - name: Duo Cruise Market を作る
        working-directory: apps/updater
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleDebug -Pvc=$VC

      - name: Duo Cruise 本体 を作る(apps/duo があるときだけ)
        if: env.HAS_DUO == '1'
        working-directory: apps/duo
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug -Pvc=$VC
          else
            gradle --no-daemon assembleDebug -Pvc=$VC
          fi

      - name: 作ったファイルの大きさ
        run: |
          ls -la apps/updater/app/build/outputs/apk/debug/ || true
          ls -la apps/duo/app/build/outputs/apk/debug/ 2>/dev/null || true
