# Android 版（Duo Cruise Market・本体）を組み立てて署名し、Upbeater から車へ配る（docs/Upbeater配布_設計書.md）。
# - 自宅の Mac の実行役（macos）で動く。GitHub Actions は使わない
# - 配るのは1つのまとめ（duo-bundle.zip：manifest.json・duo-updater.apk・duo-main.apk・戻す用の prev-*.apk）
# - 版番号（versionCode）は 2000 + Upbeater の実行番号（前の鍵の版 1199〜1201 より必ず大きい）
# - 署名の鍵は Mac の ~/.duo-cruise/signing（.upbeater/android-keygen.yml で作る）。リポジトリ・ログに出さない
# - 車の Market に埋め込む Upbeater の公開鍵は、組み立てのたびに Hub の GET /v1/keys から取る
# - 最初の版を車で確かめるまでは手動実行だけ（確かめたら push を足す：設計書 6 の 7）
name: android
on:
  manual: {}
jobs:
  build:
    name: 組み立て・署名・配布
    runs-on: macos
    timeout: 90
    concurrency: { group: duo-android, cancel-in-progress: false }
    secrets: [DUO_PUSH_TOPIC, DUO_UPLOAD_URL, DUO_UPLOAD_TOKEN]
    env:
      BT_SIGN: "34.0.0"
      BT_READ: "37.0.0"
      HUB: https://upbeater-hub.twilight-star-9d9d.workers.dev
    steps:
      - uses: checkout
        with:
          fetch-depth: 0

      # 道具は Mac の全体には入れず、足りないものだけを ~/.duo-cruise/tools に取り寄せる（2回目からは取り寄せない）
      - name: 道具をそろえる（Java 17・21・25、Gradle、Android SDK）
        run: |
          set -euo pipefail
          for v in 17 21 25; do /usr/libexec/java_home -v "$v" >/dev/null 2>&1 || { echo "Java $v が入っていません（例：brew install --cask temurin@$v）"; exit 1; }; done
          JAVA_PATHS="$(/usr/libexec/java_home -v 17),$(/usr/libexec/java_home -v 21),$(/usr/libexec/java_home -v 25)"
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 21)" >> "$GITHUB_ENV"
          echo "GRADLE_OPTS=-Dorg.gradle.java.installations.paths=$JAVA_PATHS -Dorg.gradle.java.installations.auto-download=false" >> "$GITHUB_ENV"
          TOOLS="$HOME/.duo-cruise/tools"
          mkdir -p "$TOOLS"
          # Gradle（Actions のときと同じ 8.14.3。配布元の SHA-256 と照らし合わせてから使う）
          GV=8.14.3
          if [ ! -x "$TOOLS/gradle-$GV/bin/gradle" ]; then
            echo "Gradle $GV を取り寄せます"
            T="$(mktemp -d)"
            curl -fsSL -o "$T/g.zip" "https://services.gradle.org/distributions/gradle-$GV-bin.zip"
            WANT="$(curl -fsSL "https://services.gradle.org/distributions/gradle-$GV-bin.zip.sha256" | tr -d '[:space:]')"
            GOT="$(shasum -a 256 "$T/g.zip" | cut -d' ' -f1)"
            [ -n "$WANT" ] && [ "$WANT" = "$GOT" ] || { echo "Gradle の SHA-256 が合いません"; exit 1; }
            unzip -q "$T/g.zip" -d "$TOOLS"
            rm -rf "$T"
          fi
          echo "$TOOLS/gradle-$GV/bin" >> "$GITHUB_PATH"
          "$TOOLS/gradle-$GV/bin/gradle" --version | grep -E "^Gradle "
          # Android SDK（あればそれを使う。無ければ Google の一覧から cmdline-tools を取り寄せ、SHA-1 を照らし合わせる）
          SDK="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "Android SDK の cmdline-tools を取り寄せます：$SDK"
            T="$(mktemp -d)"
            curl -fsSL -o "$T/repo.xml" https://dl.google.com/android/repository/repository2-3.xml
            PICK="$(python3 -c 'import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          for p in r.iter():
              if p.tag.endswith("remotePackage") and p.get("path") == "cmdline-tools;latest":
                  for a in p.iter():
                      if a.tag.endswith("archive") and next((x.text for x in a.iter() if x.tag.endswith("host-os")), "") == "macosx":
                          print(next(x.text for x in a.iter() if x.tag.endswith("url")), next(x.text for x in a.iter() if x.tag.endswith("checksum"))); sys.exit(0)
          sys.exit("cmdline-tools が一覧に見つかりません")' "$T/repo.xml")"
            URL="${PICK%% *}"; SHA1="${PICK##* }"
            curl -fsSL -o "$T/c.zip" "https://dl.google.com/android/repository/$URL"
            [ "$(shasum -a 1 "$T/c.zip" | cut -d' ' -f1)" = "$SHA1" ] || { echo "cmdline-tools の SHA-1 が合いません"; exit 1; }
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            unzip -q "$T/c.zip" -d "$T/x"
            mv "$T/x/cmdline-tools" "$SDK/cmdline-tools/latest"
            rm -rf "$T"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "platforms;android-37.0" "build-tools;$BT_SIGN" "build-tools;$BT_READ" \
            "ndk;27.0.12077973" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
          echo "道具がそろいました"
          # 車への即時の知らせの合言葉（ntfy の口）。秘密情報 DUO_PUSH_TOPIC が無ければ、Mac に1回だけ作って覚える
          TF="$HOME/.duo-cruise/push-topic"
          if [ -z "${DUO_PUSH_TOPIC:-}" ] && [ ! -s "$TF" ]; then (umask 077; echo "duo-$(openssl rand -hex 16)" > "$TF"); echo "知らせの合言葉を作りました（$TF）"; fi

      - name: Upbeater の公開鍵と版番号
        run: |
          set -euo pipefail
          KEYS="$(curl -fsS --max-time 20 "$HUB/v1/keys")" || { echo "Upbeater の公開鍵を取れません（Hub の署名鍵が未設定なら、Upbeater の .upbeater/hub-signing-key.yml を先に実行）"; exit 1; }
          PUB="$(printf '%s' "$KEYS" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({str(k["gen"]): k["jwk"]["x"] for k in d["keys"] if k["status"] != "revoked"}, separators=(",",":")))')"
          REV="$(printf '%s' "$KEYS" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(",".join(str(k["gen"]) for k in d["keys"] if k["status"] == "revoked"))')"
          [ "$PUB" != "{}" ] || { echo "使える公開鍵がありません"; exit 1; }
          echo "UPBEATER_PUBLIC_KEYS=$PUB" >> "$GITHUB_ENV"
          echo "UPBEATER_REVOKED_GENERATIONS=$REV" >> "$GITHUB_ENV"
          echo "公開鍵：$PUB"
          echo "VC=$((2000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -z "${DUO_PUSH_TOPIC:-}" ] && [ -s "$HOME/.duo-cruise/push-topic" ]; then echo "DUO_PUSH_TOPIC=$(cat "$HOME/.duo-cruise/push-topic")" >> "$GITHUB_ENV"; fi
          if [ -f apps/duo/settings.gradle ] || [ -f apps/duo/settings.gradle.kts ]; then echo "HAS_DUO=1" >> "$GITHUB_ENV"; else echo "HAS_DUO=0" >> "$GITHUB_ENV"; fi

      - name: 更新アプリ（Duo Cruise Market）のテスト
        working-directory: apps/updater
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon testDebugUnitTest -Pvc=$VC

      - name: Duo Cruise Market を作る
        working-directory: apps/updater
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug -Pvc=$VC

      - name: Duo Cruise 本体を作る（apps/duo があるときだけ）
        working-directory: apps/duo
        run: |
          set -euo pipefail
          [ "$HAS_DUO" = 1 ] || { echo "apps/duo が無いので、本体は作りません"; exit 0; }
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew --no-daemon assembleDebug -Pvc=$VC; else gradle --no-daemon assembleDebug -Pvc=$VC; fi

      # 1つ前に配った版の中身を、今と同じ版番号で作り直す（「1つ前の版に戻す」用。中身が変わったアプリだけ）
      - name: 1つ前の版を作り直す（戻す用）
        run: |
          set -euo pipefail
          LAST="$HOME/.duo-cruise/last-release-sha"
          mkdir -p prev-out
          [ -f "$LAST" ] || { echo "1つ前に配った版が無いので、戻す用は作りません"; exit 0; }
          PREV_SHA="$(cat "$LAST")"
          git rev-parse -q --verify "$PREV_SHA^{commit}" >/dev/null || { echo "1つ前の版のコミットが見つからないので、戻す用は作りません"; exit 0; }
          echo "PREV_SHA=$PREV_SHA" >> "$GITHUB_ENV"
          git worktree add -f prev-src "$PREV_SHA"
          for app in updater duo; do
            [ -d "prev-src/apps/$app" ] && [ -d "apps/$app" ] || continue
            if git diff --quiet "$PREV_SHA" HEAD -- "apps/$app"; then echo "$app: 中身が同じなので省きます"; continue; fi
            echo "$app: 1つ前の中身を版番号 $VC で作り直します"
            (
              cd "prev-src/apps/$app"
              echo "sdk.dir=$ANDROID_HOME" > local.properties
              if [ -f gradlew ]; then chmod +x gradlew; ./gradlew --no-daemon assembleDebug -Pvc=$VC; else gradle --no-daemon assembleDebug -Pvc=$VC; fi
            ) && cp "prev-src/apps/$app/app/build/outputs/apk/debug/app-debug.apk" "prev-out/$app.apk" \
              || echo "$app: 1つ前の中身を作れませんでした（戻す用から省きます）"
          done

      - name: 署名して、まとめを作る
        run: |
          set -euo pipefail
          DIR="$HOME/.duo-cruise/signing"
          [ -f "$DIR/mx.jks" ] && [ -f "$DIR/pass" ] || { echo "署名の鍵がありません。先に .upbeater/android-keygen.yml を実行してください"; exit 1; }
          export KS_PASS="$(cat "$DIR/pass")"
          BT="$ANDROID_HOME/build-tools/$BT_SIGN"
          rm -rf out && mkdir -p out
          sign() {
            "$BT/zipalign" -f -p 4 "$1" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$DIR/mx.jks" --ks-key-alias mx --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --v4-signing-enabled false --out "out/$2" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "out/$2"
          }
          sign apps/updater/app/build/outputs/apk/debug/app-debug.apk duo-updater.apk
          if [ "$HAS_DUO" = 1 ]; then sign apps/duo/app/build/outputs/apk/debug/app-debug.apk duo-main.apk; fi
          if [ -f prev-out/updater.apk ]; then sign prev-out/updater.apk prev-duo-updater.apk; fi
          if [ -f prev-out/duo.apk ]; then sign prev-out/duo.apk prev-duo-main.apk; fi
          rm -f out/*.idsig "$RUNNER_TEMP/aligned.apk"
          python3 tools/make_manifest.py out "$ANDROID_HOME/build-tools/$BT_READ/aapt2" "$VC" "${PREV_SHA:-}"
          (cd out && zip -q -X ../duo-bundle.zip manifest.json *.apk)
          ls -la out duo-bundle.zip
          cat out/manifest.json

      - distribute:
          platform: android
          file: duo-bundle.zip
          install:
            package: com.yuki.duocruise.updater

      # 配れたら、この版を「1つ前の版」として覚える（次の組み立てで戻す用を作るため）
      - name: 配った版を覚える
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.duo-cruise"
          git rev-parse HEAD > "$HOME/.duo-cruise/last-release-sha"
          echo "配りました：versionCode $VC（$(git rev-parse --short HEAD)）"

      # リアルタイムの更新：車の Duo Cruise が待っている口（ntfy.sh）へ「check」を送る（中身は check の一言だけ）
      - name: 車に新しい版を知らせる
        continue-on-error: true
        run: |
          if [ -n "${DUO_PUSH_TOPIC:-}" ]; then curl -fsS -d check "https://ntfy.sh/$DUO_PUSH_TOPIC" >/dev/null && echo "知らせました"; else echo "知らせの合言葉が無いので知らせません（車は15分ごとに確かめます）"; fi
