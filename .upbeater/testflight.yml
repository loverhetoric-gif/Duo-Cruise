# Duo Slate（apps/slate）の iPhone 版を署名して組み立て、TestFlight へ送る。手動実行の時だけ動かす。
# - アプリの ID は今までと同じ（com.yuki.duocruise.pad）。TestFlight から入れても、今のアプリを上書きする形で入り、設定は残る
# - apps/ の中は変えない（変えると GitHub Actions が Android 版を作り、車へ正式版として配るため）。
#   輸出コンプライアンスの答え（標準の暗号だけを使う）は、組み立ての時に作る Info.plist にだけ書き足す
# - 署名と送信には App Store Connect API のパス（Upbeater TestFlight Admin）を使う。.p8 ファイルはこの Mac の
#   ~/.appstoreconnect/private_keys/ にだけ置き、リポジトリには入れない
name: testflight
on:
  manual: {}
jobs:
  iphone:
    name: TestFlight へ送る
    runs-on: macos
    timeout: 60
    steps:
      - uses: checkout
      - name: 署名して組み立て、TestFlight へ送る
        working-directory: apps/slate
        run: |
          set -euo pipefail
          xcodegen generate --quiet
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" DuoSlate/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" DuoSlate/Info.plist
          KEY_ID=TGT37VBUY9
          ISSUER_ID=bd737835-c327-48a7-a397-8e8993d4f593
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          if [ ! -f "$KEY_PATH" ]; then echo "App Store Connect API の .p8 ファイルがこの Mac にありません：$KEY_PATH"; exit 1; fi
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          # ビルド番号は送るたびに増やす必要があるため、日時（UTC）を使う
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "ビルド番号：$BUILD_NUMBER"
          OUT="$PWD/build/testflight"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cat > "$OUT/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>8NQ4F22H32</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          ok=0
          xcodebuild -project DuoSlate.xcodeproj -scheme DuoSlate -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$OUT/dd" -archivePath "$OUT/DuoSlate.xcarchive" \
            DEVELOPMENT_TEAM=8NQ4F22H32 CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" archive > "$OUT/archive.log" 2>&1 || ok=$?
          grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" "$OUT/archive.log" | sort -u | head -n 60 || true
          [ $ok -eq 0 ] || exit $ok
          echo "組み立てが終わりました。TestFlight へ送ります"
          xcodebuild -exportArchive -archivePath "$OUT/DuoSlate.xcarchive" \
            -exportOptionsPlist "$OUT/ExportOptions.plist" -exportPath "$OUT/export" \
            "${AUTH[@]}" > "$OUT/export.log" 2>&1 || ok=$?
          grep -E "error:|Upload succeeded|EXPORT (SUCCEEDED|FAILED)" "$OUT/export.log" | sort -u | head -n 60 || true
          [ $ok -eq 0 ] || exit $ok
          echo "TestFlight へ送りました（ビルド番号 $BUILD_NUMBER）。Apple 側の処理に十数分かかります"
