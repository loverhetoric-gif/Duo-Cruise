# Duo Slate（apps/slate）を、同じ Wi-Fi にいる iPhone に直接入れる（手動で動かす）。頻繁に試す時はこちらが早い
# - Mac とペアリング済みで、同じ Wi-Fi にいる iPhone に入れる（Upbeater の組み込み部品 install-ios）
# - アプリの ID は TestFlight と同じ（com.yuki.duocruise.pad）。上書きで入れるので、設定は残る
# - 署名は有料の登録の開発用（約 1 年もつ）。署名の準備には App Store Connect API のパス（Upbeater TestFlight Admin）を使う
# - apps/ の中は変えない（変えると GitHub Actions が Android 版を作り、車へ正式版として配るため）
name: install
on:
  manual: {}
jobs:
  iphone:
    name: iPhone に入れる
    runs-on: macos
    timeout: 40
    concurrency:
      group: install-ios
      cancel-in-progress: false
    steps:
      - uses: checkout
      - name: 署名付きで組み立てる
        working-directory: apps/slate
        run: |
          set -euo pipefail
          xcodegen generate --quiet
          KEY_ID=TGT37VBUY9
          ISSUER_ID=bd737835-c327-48a7-a397-8e8993d4f593
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          if [ ! -f "$KEY_PATH" ]; then echo "App Store Connect API の .p8 ファイルがこの Mac にありません：$KEY_PATH"; exit 1; fi
          LOG="$PWD/build/install.log"
          mkdir -p build
          ok=0
          xcodebuild -project DuoSlate.xcodeproj -scheme DuoSlate -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/install-dd \
            DEVELOPMENT_TEAM=8NQ4F22H32 CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            build > "$LOG" 2>&1 || ok=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" "$LOG" | sort -u | head -n 60 || true
          exit $ok
      - uses: install-ios
        with:
          app: apps/slate/build/install-dd/Build/Products/Release-iphoneos/DuoSlate.app
