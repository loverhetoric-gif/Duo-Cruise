# iPhone のタッチパッドアプリ(Duo Pad)。`xcodegen generate` で DuoPad.xcodeproj を作る。
name: DuoPad
options:
  bundleIdPrefix: com.yuki.duocruise
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8NQ4F22H32
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DuoPad:
    type: application
    platform: iOS
    sources: [DuoPad]
    info:
      path: DuoPad/Info.plist
      properties:
        CFBundleDisplayName: Duo Pad
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: 車の中の Wi-Fi で Duo Cruise(OTTO)に直接つないで、タッチパッドとして操作するために使います。
        NSBonjourServices: [_duopad._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuki.duocruise.pad
        TARGETED_DEVICE_FAMILY: "1"
