# タッチパッドアプリ(Duo Slate。旧名 Duo Pad)。iPhone と Mac の両方で動く1つのアプリ。`xcodegen generate` で DuoPad.xcodeproj を作る。
name: DuoPad
options:
  bundleIdPrefix: com.yuki.duocruise
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8NQ4F22H32
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DuoPad:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [DuoPad]
    info:
      path: DuoPad/Info.plist
      properties:
        CFBundleDisplayName: Duo Slate
        CFBundleName: Duo Slate
        UILaunchScreen:
          UIColorName: LaunchBackground  # 標準の起動画面は背景色だけ(昼は白・夜は黒)。演出は直後の Splash で出す
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: 車の中の Wi-Fi で Duo Cruise(OTTO)に直接つないで、タッチパッドとして操作するために使います。
        NSBonjourServices: [_duopad._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yuki.duocruise.pad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
