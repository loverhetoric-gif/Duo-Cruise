plugins { id 'com.android.application' }
def vcode = (project.findProperty('vc') ?: '1').toString().toInteger()
// 記録シートの受け口の URL(apps/updater/remote.properties の log_url)。空なら送らない
def remote = new Properties()
def remoteFile = rootProject.file('remote.properties')
if (remoteFile.exists()) remoteFile.withInputStream { remote.load(it) }
def logUrl = (remote.getProperty('log_url') ?: '').trim()
if (!logUrl.isEmpty() && !logUrl.startsWith('https://')) throw new GradleException('remote.properties の log_url は https:// で始めてください')
android {
    namespace 'com.yuki.duocruise.updater'
    compileSdk 34
    defaultConfig {
        applicationId "com.yuki.duocruise.updater"
        minSdk 26
        targetSdk 33
        versionCode vcode
        versionName "0.1." + vcode
        buildConfigField "String", "LOG_URL", "\"" + logUrl.replace('"', '') + "\""
        // リアルタイムの更新の合図の口(ntfy.sh)。CI の秘密 DUO_PUSH_TOPIC から入る(Duo Cruise と同じ)。手元のビルドでは空(使わない)
        buildConfigField "String", "PUSH_TOPIC", "\"" + (System.getenv('DUO_PUSH_TOPIC') ?: '').replace('"', '') + "\""
        // 受け取り先(Upbeater)と、その署名の公開鍵(世代番号 → base64url)。公開鍵は Upbeater の GET /v1/keys の値を
        // 組み立てのときに渡す(.upbeater/android.yml)。空なら署名を確かめられないので、何も入れない
        buildConfigField "String", "UPBEATER_HUB", "\"https://upbeater-hub.twilight-star-9d9d.workers.dev\""
        buildConfigField "String", "UPBEATER_PUBLIC_KEYS", "\"" + (System.getenv('UPBEATER_PUBLIC_KEYS') ?: '').replace('\\', '').replace('"', '\\"') + "\""
        buildConfigField "String", "UPBEATER_REVOKED", "\"" + (System.getenv('UPBEATER_REVOKED_GENERATIONS') ?: '').replaceAll('[^0-9,]', '') + "\""
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    // 署名の確かめ・受け取りの決まりのテスト(gradle test。Android の機器は要らない)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
