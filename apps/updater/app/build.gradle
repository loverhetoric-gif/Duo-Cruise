plugins { id 'com.android.application' }
def vcode = (project.findProperty('vc') ?: '1').toString().toInteger()
android {
    namespace 'com.yuki.duocruise.updater'
    compileSdk 34
    defaultConfig {
        applicationId "com.yuki.duocruise.updater"
        minSdk 26
        targetSdk 33
        versionCode vcode
        versionName "0.1." + vcode
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    ndkVersion '27.0.12077973'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
